services:
  # Optional local S3 for development.
  # Set S3_ENDPOINT=http://minio:9000 and provide S3_ACCESS_KEY/S3_SECRET_KEY.
  minio:
    image: minio/minio:RELEASE.2025-01-20T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  home-agent:
    build:
      context: .
      dockerfile: home-agent/Dockerfile
    depends_on:
      - minio
    volumes:
      - ./home-agent:/app/home-agent
      - ./supabase:/app/supabase
      - ./scripts:/app/scripts
      - ./PRD.md:/app/PRD.md:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - home-agent-spool:/var/lib/karaoke-agent/spool
    command: ["python", "-m", "karaoke_agent.cli", "loop"]

volumes:
  minio-data:
  home-agent-spool:
